name: pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "*/plates.csv"
      - "*/species.csv"
      - "tools/site_*.py"
      - "tools/misnamed.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: site
      - name: Unpack the site images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(python3 -c "import json; print(json.load(open('site/src/data/images.json'))['release'])")
          gh release download "$release" -p site-images.tar -O - | tar -x -C site/dist
      - run: python3 tools/site_check.py site/dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
